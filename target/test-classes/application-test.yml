# Baseline test profile. Datasource properties are overridden per-test via @DynamicPropertySource
# against a Testcontainers Postgres instance - see JdbcSecurityRepositoryTest / *IT base classes.
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

  artemis:
    mode: embedded
    embedded:
      enabled: true
      persistent: false
      queues:
        - securities.feed.inbound
      topics:
        - securities.events

app:
  jwt:
    secret: test-only-secret-not-for-any-real-use-0123456789
    expiration-minutes: 60
