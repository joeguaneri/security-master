spring:
  application:
    name: security-master

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:securities_master}
    username: ${DB_USER:securities_master}
    password: ${DB_PASSWORD:securities_master}

  flyway:
    enabled: true
    locations: classpath:db/migration

  artemis:
    mode: embedded
    embedded:
      enabled: true
      persistent: false
      queues:
        - securities.feed.inbound
      topics:
        - securities.events

app:
  jwt:
    # Dev-only default secret (32+ bytes for HS256). Override via APP_JWT_SECRET in any real environment.
    secret: ${APP_JWT_SECRET:dev-only-secret-please-override-me-0123456789}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
